# Casdoor。它是平台的授权服务器，不是业务负载。
#
# 与 PG 分属两个 project：跨 project 没有 depends_on，启动顺序靠人（先 PG 后本服务），
# 容器用 restart: unless-stopped 兜底——连不上库就退出重启，直到 PG 就绪。
#
# 启动：docker compose -f deploy/casdoor/docker-compose.yml up -d
#
# 落盘位置（上游标准镜像的 WORKDIR 是 /）：
#   配置 /conf/app.conf   ← 从仓库只读挂入（本文件不含口令，连接参数由 environment 注入）
#   日志 /logs            ← 独立卷（Beego file adapter 写 logs/casdoor.log）
#   上传 /files           ← 暂未使用，需要时再加卷
#   /var/lib/casdoor      ← 上游镜像当前不使用；保留空卷仅作兼容

name: pandabase-casdoor

services:
  casdoor:
    image: casbin/casdoor:latest
    container_name: pandabase-casdoor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      driverName: postgres
      dataSourceName: "user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=pandabase-postgres port=5432 dbname=casdoor sslmode=disable"
      # 必须与 JWT 里的 iss 完全一致，且一旦启用不可更改（见 docs/decisions/0003）
      origin: ${CASDOOR_ORIGIN}
      runmode: prod
    volumes:
      - casdoor_data:/var/lib/casdoor
      # 配置：仓库里的 app.conf 只读挂入；改完重启容器生效
      - ./conf/app.conf:/conf/app.conf:ro
      # 日志：独立卷，容器重建不丢
      - casdoor_logs:/logs
    ports:
      # 管理台只绑回环：公网入口只有宿主 Caddy 的 auth 子域
      - "127.0.0.1:8001:8000"
    networks:
      - pandabase
      # MCP 网关需要够到 pandabase-dbx；业务容器仍不在该网络（见 ADR 0004）
      - pandabase-ops

volumes:
  casdoor_data:
    name: pandabase_casdoor_data
  casdoor_logs:
    name: pandabase_casdoor_logs

networks:
  pandabase:
    external: true
  pandabase-ops:
    external: true
