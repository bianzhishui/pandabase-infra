appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true
# 数据库连接由 compose 的 environment 注入（driverName / dataSourceName / origin），
# 这里留空，避免把口令写进仓库；缺环境变量时 Casdoor 会在启动阶段直接报错。
driverName = postgres
dataSourceName =
dbName = casdoor
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = "127.0.0.1:10808"
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
# 日志写入挂载的 /logs（镜像 WORKDIR 为 /，相对路径 logs/ 即 /logs）。
# maxdays=14：Beego 的 file adapter 在轮转时删除 14 天前的文件。
logConfig = {"adapter":"file", "filename":"logs/casdoor.log", "maxdays":14, "daily":true, "perm":"0660"}
initDataNewOnly = false
initDataFile = "./init_data.json"
frontendBaseDir = "../cc_0"
