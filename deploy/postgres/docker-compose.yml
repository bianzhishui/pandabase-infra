# 平台 PostgreSQL。独立 project，不再挂在 Casdoor 下。
#
# 前置：共享网络已存在（bash scripts/bootstrap-network.sh），否则 up 会报 network not found。
# 启动：docker compose -f deploy/postgres/docker-compose.yml up -d
#
# 卷名显式写死：Docker 会按 project 名推导卷名，改 project 时若不显式声明
# 就会静默创建一个空卷，表现为"数据没了"。见 docs/decisions/0002-postgres-platform.md。

name: pandabase

services:
  postgres:
    image: postgres:17-bookworm
    container_name: pandabase-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 仅在新卷首次 initdb 时生效；已有数据卷不看这几项
      POSTGRES_DB: postgres
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pandabase
    # 只绑回环：给宿主上的 SSH 隧道 / DBX 用，公网仍然摸不到。
    # 千万别写成 "5432:5432"——那是绑 0.0.0.0，而 PG 自己 ssl=off，等于明文对全网开放。
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    name: pandabase_pgdata

networks:
  pandabase:
    external: true
